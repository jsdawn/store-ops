# store-ops 开发环境中间件（P0）
name: store-ops-dev
# 只包含最小集：MySQL 8 / Redis / Nacos。版本与 store-ops-api/script/docker/docker-compose.yml 对齐。
# 用法：docker compose -f docker-compose.dev.yml up -d
# 凭据：全部经环境变量注入，真实值在同级 .env（gitignored，模板见 .env.example）。
# 注意：官方 compose 定义了 minio/seata/nginx/monitor 等 10 个服务，开发期不需要，勿全量启动。

services:
  mysql:
    image: mysql:8.4.9
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?请在 script/docker/.env 中设置 MYSQL_PASSWORD}
      - TZ=Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动创建 4 个业务空库（脚本本身不含 CREATE DATABASE）
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.3
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 script/docker/.env 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: nacos
    restart: unless-stopped
    ports:
      - "8848:8848"   # Open API
      - "9848:9848"   # gRPC 客户端（客户端端口 = 8848 + 1000，必须映射）
      - "9849:9849"   # gRPC 服务端同步
      - "8080:8080"   # v3 控制台 UI
    environment:
      - MODE=standalone
      # v3 无默认密码：首次启动后在控制台/接口初始化管理员密码（与 .env 的 NACOS_PASSWORD 一致）
      # admin/console/system-type 三个开关在 v3 必须显式开启，否则 8848 全部接口 500
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_ADMIN_ENABLE=true
      - NACOS_AUTH_CONSOLE_ENABLE=true
      - NACOS_AUTH_SYSTEM_TYPE=nacos
      # v3 镜像强制要求这三个变量（即使鉴权关闭），缺失会 exit 255
      - NACOS_AUTH_TOKEN=${NACOS_TOKEN:?请在 script/docker/.env 中设置 NACOS_TOKEN（Base64）}
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_IDENTITY_VALUE:?请在 script/docker/.env 中设置 NACOS_IDENTITY_VALUE}
      - TZ=Asia/Shanghai
      - JVM_XMS=256m
      - JVM_XMX=512m
      # 禁用 v3 的 AI 注册中心（Skill/Agent/Prompt/MCP 管理）
      - JAVA_OPT_EXT=-Dnacos.extension.ai.enabled=false
    # 釜底抽薪：3.2.3 的 AI 自带内容导入器（nacos-default-ai-importer-plugin）无任何配置开关可关
    # （实测 -D 开关无效，启动后仍由服务端内部批量灌入 2200+ 配置），
    # 直接在启动前删除该插件 jar（Skill 内容打包其中），SPI 无实现可加载
    entrypoint:
      - bash
      - -c
      - rm -f /home/nacos/plugins/nacos-default-ai-importer-plugin-3.2.3.jar && exec bash bin/docker-startup.sh
    volumes:
      - nacos-data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # v3 移除了 v1 readiness 接口；/v3/console/server/state 等均为 404（实测）
      # 可用的无鉴权状态端点是 /nacos/v3/admin/core/state
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v3/admin/core/state"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  nacos-data:
