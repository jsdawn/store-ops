# =====================================================================
# store-ops prod 编排(Linux 服务器,host 网络,对齐官方 docker-compose.yml)
#
# 与官方编排的差异(仅两处,均已注释标明):
#   1. 密钥从 .env 读取(mysql/redis/minio/nacos 配置库/seata 凭据)
#   2. nacos/seata 挂载 override 覆盖文件,使镜像内烘焙的 127.0.0.1 + root/root
#      连接信息与 .env 强密码保持一致(host 网络下地址值与官方相同)
#   3. 扩展服务(elk/rocketmq/rabbitmq/kafka/skywalking/prometheus/grafana 等)
#      不在本文件,需要时参照官方 docker-compose.yml 扩展段
#
# 部署约定(官方假设): 本文件与 mysql/nacos/redis 等子目录上传至服务器 /docker 下,
# 挂载路径 /docker/... 与官方完全一致
# 首次启动(分步,保证 nacos 先于 seata 就绪):
#   cd /docker && cp .env.example .env   # 填写 prod 值
#   docker compose -f docker-compose.prod.yml up -d mysql nacos redis minio
#   # 待 nacos 就绪后导入配置(见 README),再启动其余服务:
#   docker compose -f docker-compose.prod.yml up -d
# =====================================================================
name: store-ops-prod

services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码(.env)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 初始化数据库
      MYSQL_DATABASE: ry-cloud
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nacos:
    image: ruoyi/ruoyi-nacos:2.6.2
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"
      # host 网络下与官方烘焙值一致(经 override 文件注入,地址用 127.0.0.1、密码走 .env)
      NACOS_DB_HOST: 127.0.0.1
      NACOS_DB_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # 日志目录 注意集群模式下 日志目录不能一致 需要区分例如 nacos1 nacos2
      - /docker/nacos/logs/:/root/nacos/logs
      # 集群配置文件 集群所有nacos都必须使用此文件
      - /docker/nacos/conf/cluster.conf:/root/nacos/conf/cluster.conf
      # 自建覆盖文件: 仅覆盖 db.url.0/db.user.0/db.password.0 三键
      - /docker/nacos/override/application.properties:/ruoyi/nacos/config/application.properties
    network_mode: "host"

  redis:
    image: redis:7.2.8
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config
      # 数据文件
      - /docker/redis/data/:/redis/data/
    # 命令行参数优先于配置文件: 密码统一走 .env(官方 redis.conf 烘焙 ruoyi123)
    command: "redis-server /redis/config/redis.conf --requirepass ${REDIS_PASSWORD}"
    privileged: true
    network_mode: "host"

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名(.env)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      # 管理后台密码，最小8个字符(.env)
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  seata-server:
    image: ruoyi/ruoyi-seata-server:2.6.2
    container_name: seata-server
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      # TC 注册地址(.env): 留空自动检测本机网卡;云服务器/多网卡显式填写
      SEATA_IP: ${SEATA_IP:-}
      SEATA_PORT: 8091
      # host 网络下与官方烘焙值一致(经 override 文件注入,地址用 127.0.0.1、凭据走 .env)
      NACOS_SERVER_ADDR: 127.0.0.1:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    volumes:
      - /docker/ruoyi-seata-server/logs/:/ruoyi/seata-server/logs
      # file 存储模式会话持久化(store.file.dir,见 script/config/nacos/seata-server.properties)
      - /docker/ruoyi-seata-server/file-store:/ruoyi/seata-server/file-store
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
      # 自建覆盖文件: 仅覆盖 registry/config 的 server-addr 与凭据(其余键继承镜像内官方值)
      - /docker/seata/override/application.yml:/ruoyi/seata-server/config/application.yml
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.22.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  ruoyi-monitor:
    image: ruoyi/ruoyi-monitor:2.6.2
    container_name: ruoyi-monitor
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9100:9100"
    volumes:
      # 配置文件
      - /docker/ruoyi-monitor/logs/:/ruoyi/monitor/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-snailjob-server:
    image: ruoyi/ruoyi-snailjob-server:2.6.2
    container_name: ruoyi-snailjob-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "8800:8800"
      - "17888:17888"
    volumes:
      - /docker/snailjob/logs/:/ruoyi/snailjob/logs
    privileged: true
    network_mode: "host"

  ruoyi-gateway:
    image: ruoyi/ruoyi-gateway:2.6.2
    container_name: ruoyi-gateway
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 配置文件
      - /docker/ruoyi-gateway/logs/:/ruoyi/gateway/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-auth:
    image: ruoyi/ruoyi-auth:2.6.2
    container_name: ruoyi-auth
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9210:9210"
    volumes:
      # 配置文件
      - /docker/ruoyi-auth/logs/:/ruoyi/auth/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-system:
    image: ruoyi/ruoyi-system:2.6.2
    container_name: ruoyi-system
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9201:9201"
    volumes:
      # 配置文件
      - /docker/ruoyi-system/logs/:/ruoyi/system/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-gen:
    image: ruoyi/ruoyi-gen:2.6.2
    container_name: ruoyi-gen
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9202:9202"
    volumes:
      # 配置文件
      - /docker/ruoyi-gen/logs/:/ruoyi/gen/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-job:
    image: ruoyi/ruoyi-job:2.6.2
    container_name: ruoyi-job
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 9203
      SNAIL_PORT: 19203
    ports:
      - "9203:9203"
    volumes:
      # 配置文件
      - /docker/ruoyi-job/logs/:/ruoyi/job/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-resource:
    image: ruoyi/ruoyi-resource:2.6.2
    container_name: ruoyi-resource
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9204:9204"
    volumes:
      # 配置文件
      - /docker/ruoyi-resource/logs/:/ruoyi/resource/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-workflow:
    image: ruoyi/ruoyi-workflow:2.6.2
    container_name: ruoyi-workflow
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9205:9205"
    volumes:
      # 配置文件
      - /docker/ruoyi-workflow/logs/:/ruoyi/workflow/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"

# =====================================================================
# 扩展服务(elk / rocketmq / rabbitmq / kafka / skywalking / prometheus /
# grafana / shardingproxy)按需参照官方 docker-compose.yml 扩展段添加
# =====================================================================
