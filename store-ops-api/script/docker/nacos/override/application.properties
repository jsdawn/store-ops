# ============================================================
# store-ops 自建覆盖文件(非官方文件)
# 挂载到容器 /ruoyi/nacos/config/application.properties
# Spring Boot 外部配置 file:./config/ 优先级高于 jar 内 application.properties
# 且按"键级合并"——本文件只写差异键,其余键继承镜像内官方烘焙值
#
# 差异原因: 镜像内烘焙 db.url.0=127.0.0.1:3306(host 网络专用),
#          dev 为 bridge 网络需指向 compose 服务名;密码统一走 .env
# 变量由 compose 的 environment 注入(见 docker-compose.dev.yml / prod.yml)
# ============================================================
db.url.0=jdbc:mysql://${NACOS_DB_HOST}:3306/ry-config?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user.0=${NACOS_DB_USER}
db.password.0=${MYSQL_ROOT_PASSWORD}
