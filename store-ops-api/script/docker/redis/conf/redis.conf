# redis 密码
requirepass ruoyi123

# key 监听器配置
# notify-keyspace-events Ex

# 配置持久化文件存储路径
# 自建适配: /data 为镜像自带 redis 用户属主目录(数据卷挂载点,见 compose volumes),
# 官方 /redis/data 为 root 目录,redis 用户创建 AOF 目录 Permission denied
dir /data
# 配置rdb
# 15分钟内有至少1个key被更改则进行快照
save 900 1
# 5分钟内有至少10个key被更改则进行快照
save 300 10
# 1分钟内有至少10000个key被更改则进行快照
save 60 10000
# 开启压缩
rdbcompression yes
# rdb文件名 用默认的即可
dbfilename dump.rdb

# 开启aof
appendonly yes
# 文件名
appendfilename "appendonly.aof"
# 持久化策略,no:不同步,everysec:每秒一次,always:总是同步,速度比较慢
# appendfsync always
appendfsync everysec
# appendfsync no
